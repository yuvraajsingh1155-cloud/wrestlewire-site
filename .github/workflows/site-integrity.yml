name: Verify WrestleWire publication integrity
on:
  push:
    paths:
      - 'index.html'
      - 'articles/**'
      - 'wrestlers/**'
      - 'assets/features/**'
      - 'data/**'
      - 'sitemap.xml'
      - 'scripts/check_site_integrity.py'
      - '.github/workflows/site-integrity.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site_integrity.py
