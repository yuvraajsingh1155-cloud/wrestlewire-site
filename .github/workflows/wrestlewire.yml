name: Update WrestleWire Official Source Radar

on:
  push:
    branches: [main]
    paths:
      - 'scripts/source_radar.py'
      - 'scripts/publish_briefs.py'
      - 'scripts/ai_drafts.py'
      - 'tests/test_source_radar.py'
      - 'tests/test_publish_briefs.py'
      - '.github/workflows/wrestlewire.yml'
  schedule:
    # Every three hours; GitHub scheduling is best effort and may be delayed.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrestlewire-official-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify official-feed security checks
        run: python -m unittest discover -s tests -v
      - name: Fetch latest official WWE and AEW videos
        run: python scripts/source_radar.py
      - name: Commit verified official-source updates
        run: |
          git config user.name "wrestlewire-newsroom[bot]"
          git config user.email "wrestlewire-newsroom[bot]@users.noreply.github.com"
          # On a busy repository another push can arrive while the feed updates.
          # Always regenerate on the latest main branch rather than overwriting changes.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/source_radar.py
            python scripts/publish_briefs.py
            git add index.html data/source_radar.json
            # New posts are unindexed source briefs and never include unverified outcomes.
            if [ -d news ]; then git add -A news; fi
            if git diff --cached --quiet; then
              echo "No fresh official sources to publish."
              exit 0
            fi
            git commit -m "newsroom: refresh verified WWE/AEW source links [skip ci]"
            if git push origin HEAD:main; then
              echo "Source links updated safely on main."
              exit 0
            fi
            echo "Concurrent GitHub update detected; retrying with latest main."
          done
          echo "Source refresh could not be pushed without conflicts."
          exit 1

      - name: Optional free-tier Gemini review draft
        if: ${{ vars.ENABLE_FREE_AI_DRAFTS == 'true' }}
        env:
          ENABLE_FREE_AI_DRAFTS: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_drafts.py
      - name: Preserve unpublished AI draft for editorial review
        if: ${{ vars.ENABLE_FREE_AI_DRAFTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wrestlewire-review-draft
          path: review_drafts/*.md
          if-no-files-found: ignore
          retention-days: 7
