name: Upgrade WrestleWire archive reading experience

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_reader.py'
      - 'tests/test_upgrade_reader.py'
      - '.github/workflows/reader-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrestlewire-reader-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safe offline tests
        run: python -m unittest discover -s tests -v
      - name: Apply photo-safe reading experience
        run: python scripts/upgrade_reader.py
      - name: Verify site links, sitemap, photo coverage and legacy articles
        run: python scripts/check_site_integrity.py
      - name: Publish upgraded archive without overwriting other work
        run: |
          git config user.name "wrestlewire-archive[bot]"
          git config user.email "wrestlewire-archive[bot]@users.noreply.github.com"
          git add articles/ wrestlers/
          if git diff --cached --quiet; then
            echo "Reader upgrade already up-to-date"
            exit 0
          fi
          git commit -m "ui: upgrade static archive reader and verified photo credits [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
